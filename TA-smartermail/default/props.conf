# TA-smartermail/default/props.conf

[smartermail:log]
SHOULD_LINEMERGE = true
LINE_BREAKER = ([\r\n]+)(?=\d{2}:\d{2}:\d{2}\.\d{3})
TIME_PREFIX = ^
TIME_FORMAT = %H:%M:%S.%3N
MAX_TIMESTAMP_LOOKAHEAD = 15
TRUNCATE = 0
NO_BINARY_CHECK = true
category = Email
description = SmarterMail logs with CIM Email alignment
pulldown_type = true
KV_MODE = none

# --- Field Extractions ---
REPORT-smartermail_protocol_source = smartermail_extract_protocol_from_source
REPORT-smartermail_session = smartermail_extract_session_id
REPORT-smartermail_email = smartermail_extract_email_fields
REPORT-smartermail_sender_smtp = smartermail_extract_sender_from_smtp
REPORT-smartermail_recipient = smartermail_extract_recipient
REPORT-smartermail_ip = smartermail_extract_ip_fields
REPORT-smartermail_src_delivery = smartermail_extract_src_from_delivery
REPORT-smartermail_auth = smartermail_extract_auth_fields
REPORT-smartermail_auth_fail = smartermail_extract_auth_failure
REPORT-smartermail_login_user = smartermail_extract_login_user
REPORT-smartermail_msgid = smartermail_extract_message_id
REPORT-smartermail_smtp_rsp = smartermail_extract_remote_response
REPORT-smartermail_dkim = smartermail_extract_dkim_errors
REPORT-smartermail_mx = smartermail_extract_remote_mx
REPORT-smartermail_dest_ip = smartermail_extract_remote_ip

# --- CIM Email Data Model Alignment ---
# Extract raw action (from both delivery logs and SMTP logs)
REPORT-smartermail_cim_action_raw = smartermail_extract_cim_action_raw

# Map action_raw to CIM-compliant action via lookup
LOOKUP-smartermail_cim_action = smartermail_cim_action_map action_raw OUTPUTNEW action

# --- CIM Field Aliases ---
# NOTE: FIELDALIAS-smartermail_src is REMOVED because src is extracted directly by REPORT-smartermail_ip
FIELDALIAS-smartermail_dest = dest_host AS dest dest AS dest
FIELDALIAS-smartermail_protocol = protocol_cim AS protocol

# --- Additional CIM Fields ---
REPORT-smartermail_cim_size = smartermail_extract_cim_size