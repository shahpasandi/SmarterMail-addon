# TA-smartermail/default/savedsearches.conf

[SmarterMail - Failed Login Attempts by IP and User]
search = index=mail sourcetype="smartermail:log" earliest=-24h \
| search "Login failed" OR "Invalid Credentials" OR "Authentication failed" \
| stats values(src) as src, values(src_user) as src_user by session_id \
| mvexpand src_user \
| mvexpand src \
| stats count as failed_attempts by src, src_user \
| sort - failed_attempts
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 0 * * * *

[SmarterMail - Top Source IPs for Failed Logins]
search = index=mail sourcetype="smartermail:log" earliest=-24h "Login failed" | stats count by src | sort -count | head 10
dispatch.earliest_time = -24h
enableSched = 1
cron_schedule = 0 */6 * * *
